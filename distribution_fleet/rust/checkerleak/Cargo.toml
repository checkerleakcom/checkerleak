[package]
name = "checkerleak"
version = "0.1.0"
edition = "2021"
authors = ["CheckerLeak Team <support@checkerleak.com>"]
description = "Official Rust client for CheckerLeak.com phone number intelligence, carrier HLR lookup, and VoIP fraud detection."
license = "MIT"
readme = "README.md"
homepage = "https://checkerleak.com"
repository = "https://github.com/checkerleak/checkerleak-rs"
keywords = ["phone", "telecom", "hlr-lookup", "carrier", "voip"]
categories = ["api-bindings", "web-programming"]

[dependencies]
reqwest = { version = "0.11", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
